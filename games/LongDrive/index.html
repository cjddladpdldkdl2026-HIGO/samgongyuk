<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>사랑하는 그대에게 기대세요 — 삼공육</title>
<meta name="theme-color" content="#0b0221">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 사랑하는 그대에게 기대세요 (골프 비거리 게임, 폴더 이름은 예전 이름 LongDrive 그대로) — 문제 풀고 캐쉬 벌어서, 골프채·공·파워 사서 더 멀리!
 * 화면: 캔버스(밤의 네온 골프 연습장) 위에 HUD · 메뉴 · 문제 · 상점 · 랭킹 창이 올라가요. */
:root {
  --bg: #0b0221; --panel: rgba(20, 6, 48, .92); --line: rgba(255, 255, 255, .14);
  --ink: #f6f1ff; --sub: #b9a8dd; --pink: #ff2e88; --cyan: #2de2e6; --lime: #b6ff3b; --gold: #ffd23f;
  --font: "Pretendard Variable", Pretendard, system-ui, sans-serif; --title: "Black Han Sans", var(--font); --num: "Rajdhani", var(--font);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.hidden { display: none !important; }

/* ── HUD ── */
#hud { position: fixed; inset: 0; pointer-events: none; }
#topbar { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 24px)); }
#track { position: relative; height: 16px; border-radius: 99px; background: rgba(0, 0, 0, .45); border: 2px solid rgba(182, 255, 59, .6); box-shadow: 0 0 18px rgba(182, 255, 59, .35); overflow: visible; }
#trackFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, #6bff8b, var(--lime)); }
.mark { position: absolute; top: -3px; width: 3px; height: 22px; border-radius: 2px; transform: translateX(-50%); }
.mark span { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: rgba(0, 0, 0, .6); }
.mark.me { background: var(--cyan); } .mark.me span { color: var(--cyan); top: 36px; }
.mark.top { background: var(--gold); } .mark.top span { color: var(--gold); top: -20px; }
#trackBall { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; transform: translate(-50%, -50%); }
.ticks { display: flex; justify-content: space-between; font: 700 11px var(--num); color: var(--sub); margin-top: 2px; padding: 0 2px; }

#chips { position: absolute; top: max(62px, calc(env(safe-area-inset-top) + 52px)); left: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px; background: rgba(0, 0, 0, .5); border: 1px solid var(--line); font-weight: 700; font-size: 14px; backdrop-filter: blur(4px); }
.chip b { font: 700 18px var(--num); color: var(--gold); }
.chip.gear { font-size: 12px; color: var(--sub); font-weight: 600; }
#sideBtns { position: absolute; top: max(62px, calc(env(safe-area-inset-top) + 52px)); right: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
.sbtn { width: 52px; height: 52px; border-radius: 14px; background: rgba(0, 0, 0, .55); border: 2px solid var(--line); font-size: 22px; display: grid; place-items: center; line-height: 1; }
.sbtn small { display: block; font-size: 9px; font-weight: 700; margin-top: 2px; color: var(--sub); }
.sbtn:hover { border-color: var(--cyan); }

#wind { position: absolute; top: max(62px, calc(env(safe-area-inset-top) + 52px)); left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 12px; background: rgba(0, 0, 0, .5); border: 1px solid var(--line); font-weight: 700; font-size: 13px; display: flex; gap: 8px; align-items: center; }
#windArrow { display: inline-block; font-size: 18px; color: var(--cyan); transition: transform .3s; }

/* 스윙 게이지 */
#swing { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); pointer-events: none; }
#swingHint { text-align: center; font-weight: 800; font-size: 15px; margin-bottom: 8px; text-shadow: 0 2px 8px #000; }
#meter { position: relative; height: 30px; border-radius: 10px; background: rgba(0, 0, 0, .6); border: 2px solid rgba(255, 255, 255, .35); overflow: hidden; }
#meterPow { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #2de2e6, #b6ff3b 60%, #ffd23f 85%, #ff2e88); opacity: .85; }
#meterZone { position: absolute; top: 0; bottom: 0; background: rgba(255, 255, 255, .22); border-left: 2px solid #fff; border-right: 2px solid #fff; }
#meterSweet { position: absolute; top: 0; bottom: 0; background: rgba(255, 210, 63, .7); }
#meterCursor { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 10px #fff; }
#meterSet { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--pink); display: none; }
.meterLbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); font-weight: 700; margin-top: 3px; }

/* 결과 */
#result { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center; transition: .35s cubic-bezier(.2, 1.6, .4, 1); pointer-events: none; }
#result.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#result .big { font: 400 clamp(56px, 13vw, 110px)/1 var(--title); color: #fff; text-shadow: 0 0 22px var(--lime), 0 4px 0 #1b5e20; letter-spacing: 1px; }
#result .big small { font-size: .45em; }
#result .msg { margin-top: 8px; font-weight: 800; font-size: 20px; text-shadow: 0 2px 10px #000; }
#result .msg.best { color: var(--gold); }
#result .msg.ob { color: var(--pink); }
#result .sub { margin-top: 4px; font-size: 14px; color: var(--sub); text-shadow: 0 2px 8px #000; }
#steer { position: absolute; left: 50%; bottom: max(30px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; align-items: center; gap: 14px; pointer-events: auto; }
#steer.on { display: flex; }
#steer span { white-space: nowrap; font: 800 13px var(--font); color: var(--sub); text-shadow: 0 1px 4px #000; }
#steer button { width: 74px; height: 64px; border-radius: 18px; font-size: 26px; color: #10230a; background: linear-gradient(135deg, #6bff8b, var(--lime)); border: 0; box-shadow: 0 6px 18px rgba(0, 0, 0, .35), 0 0 16px rgba(182, 255, 59, .45); touch-action: none; user-select: none; -webkit-user-select: none; }
#steer button.hold { transform: scale(.94); filter: brightness(1.15); }
#flyDist { position: absolute; right: 18px; bottom: 110px; font: 700 42px/1 var(--num); text-shadow: 0 0 14px var(--cyan); opacity: 0; transition: opacity .2s; }
#flyDist.on { opacity: 1; }

/* ── 창(메뉴·문제·상점·랭킹) ── */
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(6, 0, 20, .55); backdrop-filter: blur(3px); z-index: 10; overflow-y: auto; }
.card { width: min(560px, 100%); background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 40px rgba(255, 46, 136, .15); }
.card h2 { margin: 0 0 4px; font: 400 28px var(--title); letter-spacing: .5px; }
.card .lead { margin: 0 0 16px; color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 120px; padding: 14px 16px; border-radius: 14px; font-weight: 800; font-size: 16px; background: rgba(255, 255, 255, .08); border: 2px solid var(--line); transition: transform .1s, border-color .15s; }
.btn:hover { border-color: var(--cyan); }
.btn:active { transform: scale(.97); }
.btn.main { background: linear-gradient(135deg, var(--pink), #9b5cff); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(255, 46, 136, .4); }
.btn.lime { background: linear-gradient(135deg, #6bff8b, var(--lime)); color: #10230a; border-color: transparent; }
.btn.gold { background: linear-gradient(135deg, var(--gold), #ff9f1c); color: #2a1600; border-color: transparent; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 255, 255, .08); font-size: 18px; }
.card { position: relative; }

/* 메뉴 */
.logo { text-align: center; margin: 4px 0 6px; font: 400 clamp(30px, 8vw, 44px)/1.12 var(--title); background: linear-gradient(180deg, #fff 10%, var(--lime) 55%, #2fbf71); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 16px rgba(182, 255, 59, .55)) drop-shadow(0 4px 0 #13361c); }
.tagline { text-align: center; color: var(--sub); font-weight: 700; margin-bottom: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font: 700 24px var(--num); }
.stat span { font-size: 12px; color: var(--sub); }
.menu { display: grid; gap: 8px; }
.menu .btn { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; }
.menu .btn em { font-style: normal; font-size: 24px; }
.menu .btn small { display: block; font-weight: 600; font-size: 12px; opacity: .8; }
.chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.charBtn { position: relative; overflow: hidden; padding: 0 0 7px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 2px solid var(--line); text-align: center; font-weight: 800; font-size: 13px; }
.charBtn img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 4px; background: radial-gradient(circle at 50% 35%, rgba(182, 255, 59, .18), transparent 70%); }
.charBtn.on img { background: radial-gradient(circle at 50% 35%, rgba(182, 255, 59, .45), transparent 72%); }
.charBtn.on { border-color: var(--lime); background: rgba(182, 255, 59, .14); box-shadow: 0 0 14px rgba(182, 255, 59, .35); }
.charBtn.lock { opacity: .45; filter: grayscale(1); }
.charBtn .lk { position: absolute; top: 5px; right: 6px; font-size: 14px; }
.charBtn .need { display: block; font-size: 11px; font-weight: 700; color: var(--gold); margin-top: 1px; }
.charTitle { font-size: 12px; color: var(--sub); margin: 0 0 6px 2px; }
.who { margin-top: 12px; text-align: center; font-size: 13px; color: var(--sub); }
.who b { color: var(--cyan); }
.back { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 15px; color: var(--ink); text-decoration: none; background: rgba(255, 255, 255, .08); border: 2px solid var(--line); }
.back:hover { border-color: var(--cyan); }
.escHint { text-align: center; margin-top: 8px; font-size: 12px; color: var(--sub); }
.escHint kbd { font: 700 11px var(--num); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); }
.chip.homeBtn { color: var(--ink); text-decoration: none; font-size: 13px; background: rgba(13, 59, 102, .75); border-color: rgba(45, 226, 230, .45); }
.chip.homeBtn:hover { border-color: var(--cyan); }

/* 문제 */
.qtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-right: 44px; font-weight: 800; }
.qtop .cash { color: var(--gold); font-family: var(--num); font-size: 20px; }
.qbar { height: 6px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-bottom: 16px; }
.qbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--lime)); transition: width .3s; }
.qtext { font-size: 20px; font-weight: 800; line-height: 1.45; margin-bottom: 16px; word-break: keep-all; white-space: pre-line; }
.qsrc { font-size: 12px; font-weight: 700; color: var(--sub); margin: -6px 0 8px; }
.logo span { font-size: 1.35em; }
.choices { display: grid; gap: 8px; }
.choices.ox { grid-template-columns: 1fr 1fr; }
.choice { text-align: left; padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, .07); border: 2px solid var(--line); font-weight: 700; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.choices.ox .choice { justify-content: center; font: 400 44px var(--title); padding: 18px; }
.choice .n { flex: none; width: 26px; height: 26px; border-radius: 8px; background: rgba(255, 255, 255, .12); display: grid; place-items: center; font-size: 13px; }
.choice:hover { border-color: var(--cyan); }
.choice.right { border-color: var(--lime); background: rgba(182, 255, 59, .18); }
.choice.wrong { border-color: var(--pink); background: rgba(255, 46, 136, .2); }
.choices.done .choice { pointer-events: none; }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-weight: 700; line-height: 1.5; }
.feedback.good { background: rgba(182, 255, 59, .14); border: 1px solid rgba(182, 255, 59, .5); }
.feedback.bad { background: rgba(255, 46, 136, .14); border: 1px solid rgba(255, 46, 136, .5); }
.feedback small { display: block; font-weight: 600; color: var(--sub); margin-top: 4px; }
.coinpop { position: fixed; font: 700 26px var(--num); color: var(--gold); text-shadow: 0 0 10px rgba(255, 210, 63, .8); pointer-events: none; animation: coin .9s ease-out forwards; z-index: 30; }
@keyframes coin { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }
.summary { text-align: center; }
.summary .score { font: 400 64px/1.1 var(--title); color: var(--lime); }

/* 상점 */
.shopTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.wallet { font: 700 24px var(--num); color: var(--gold); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.tab { padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 2px solid var(--line); font-weight: 800; }
.tab.on { border-color: var(--pink); background: rgba(255, 46, 136, .18); }
.items { display: grid; gap: 8px; max-height: min(52vh, 440px); overflow-y: auto; padding-right: 2px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 2px solid var(--line); }
.item .ic { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; background: rgba(0, 0, 0, .3); }
.item .info { flex: 1; min-width: 0; }
.item .info b { display: block; font-size: 15px; }
.item .info small { color: var(--sub); font-size: 12px; }
.item.own { border-color: rgba(182, 255, 59, .55); }
.item.cur { border-color: var(--lime); background: rgba(182, 255, 59, .1); }
.item.lock { opacity: .55; }
.item .buy { flex: none; padding: 9px 12px; border-radius: 11px; font-weight: 800; font-size: 14px; background: linear-gradient(135deg, var(--gold), #ff9f1c); color: #2a1600; }
.item .buy[disabled] { background: rgba(255, 255, 255, .1); color: var(--sub); }
.item .tag { flex: none; font-size: 12px; font-weight: 800; color: var(--lime); }
.powerBox { text-align: center; padding: 10px 0; }
.pips { display: flex; gap: 5px; justify-content: center; margin: 14px 0; }
.pips i { width: 22px; height: 30px; border-radius: 6px; background: rgba(255, 255, 255, .1); border: 1px solid var(--line); }
.pips i.on { background: linear-gradient(180deg, var(--gold), var(--pink)); box-shadow: 0 0 10px rgba(255, 46, 136, .5); border-color: transparent; }

/* 랭킹 */
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rank li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .05); }
.rank li.me { background: rgba(45, 226, 230, .15); border: 1px solid var(--cyan); }
.rank .no { width: 32px; text-align: center; font: 700 18px var(--num); }
.rank .nm { flex: 1; font-weight: 700; }
.rank .d { font: 700 20px var(--num); color: var(--lime); }
.rank .empty { justify-content: center; color: var(--sub); padding: 24px; text-align: center; line-height: 1.6; }
.note { margin-top: 12px; font-size: 13px; color: var(--sub); line-height: 1.5; }
.note b { color: var(--ink); }

#toast { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: rgba(0, 0, 0, .8); border: 1px solid var(--line); font-weight: 700; z-index: 40; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; }
#toast.on { opacity: 1; }

@media (max-width: 520px) {
  .card { padding: 18px 16px; border-radius: 18px; }
  .qtext { font-size: 18px; }
  .sbtn { width: 46px; height: 46px; font-size: 19px; }
  #flyDist { font-size: 32px; bottom: 120px; }
  .chip.gear { display: none; }
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="topbar">
    <div id="track"><div id="trackFill"></div><div id="trackMarks"></div><div id="trackBall"></div></div>
    <div class="ticks" id="ticks"></div>
  </div>
  <div id="chips">
    <a class="chip homeBtn" id="bHome" href="../../highgo.html" title="삼공육 홈으로 (ESC = 메뉴)">← 삼공육</a>
    <div class="chip">💰 <b id="cashChip">0</b></div>
    <div class="chip gear" id="gearChip"></div>
  </div>
  <div id="wind"><span id="windArrow">↑</span><span id="windText">바람 0.0m/s</span></div>
  <div id="sideBtns">
    <button class="sbtn" id="bQuiz" title="문제 풀기">📝<small>문제</small></button>
    <button class="sbtn" id="bShop" title="상점">🛒<small>상점</small></button>
    <button class="sbtn" id="bRank" title="랭킹">🏆<small>랭킹</small></button>
    <button class="sbtn" id="bMenu" title="메뉴">🏠<small>메뉴</small></button>
  </div>
  <div id="result"><div class="big" id="resBig"></div><div class="msg" id="resMsg"></div><div class="sub" id="resSub"></div></div>
  <div id="flyDist">0m</div>
  <div id="steer"><button id="stL" aria-label="왼쪽으로">◀</button><span>공 조종</span><button id="stR" aria-label="오른쪽으로">▶</button></div>
  <div id="swing">
    <div id="swingHint">화면을 탭하거나 스페이스바를 눌러 스윙 시작!</div>
    <div id="meter"><div id="meterPow"></div><div id="meterZone"></div><div id="meterSweet"></div><div id="meterSet"></div><div id="meterCursor"></div></div>
    <div class="meterLbl"><span>임팩트</span><span>파워 →</span><span>MAX</span></div>
  </div>
</div>

<!-- 첫 화면 -->
<div class="screen" id="sHome">
  <div class="card">
    <div class="logo">사랑하는 그대에게<br><span>기대세요</span></div>
    <div class="tagline">문제 풀고 💰 캐쉬 벌어서, 장비 사서 더 멀리! ⛳</div>
    <div class="stats">
      <div class="stat"><b id="hBest">0</b><span>내 최고 (m)</span></div>
      <div class="stat"><b id="hCash">0</b><span>캐쉬</span></div>
      <div class="stat"><b id="hRank">-</b><span>내 순위</span></div>
    </div>
    <div class="charTitle">🏌️ 캐릭터 고르기</div>
    <div class="chars" id="charList"></div>
    <div class="menu">
      <button class="btn main" id="mPlay"><em>⛳</em><span>치러 가기<small>지금 장비로 최대한 멀리 날려 봐요</small></span></button>
      <button class="btn lime" id="mQuiz"><em>📝</em><span>문제 풀고 캐쉬 벌기<small>한 문제 맞힐 때마다 💰 20 · 연속 정답 보너스</small></span></button>
      <button class="btn gold" id="mShop"><em>🛒</em><span>상점<small>골프채 · 골프공 · 파워</small></span></button>
      <button class="btn" id="mRank"><em>🏆</em><span>랭킹<small>삼공육 회원 비거리 TOP 10</small></span></button>
    </div>

/* ═══════════════════════════════════════════════════════════════

  if (phase === "ready") { phase = "power"; meterPos = 0; meterDir = 1; $("swingHint").textContent = "한 번 더 탭해서 파워 결정! (오른쪽 끝 = MAX)"; snd("tick"); }
  else if (phase === "power") {

    $("meterSet").style.display = "block"; $("meterSet").style.left = (setPower * 100) + "%";
    $("swingHint").textContent = "커서가 노란 칸에 올 때 탭! (임팩트)"; snd("tick");

function hit(pos) {

  if (Math.abs(pos - ZONE.at) <= ZONE.sweet / 2) acc = 0;
  acc = Math.max(-1.6, Math.min(1.6, acc));
  const club = CLUBS[S.club], b = BALLS[S.ball];
  const quality = Math.max(.35, 1 - .2 * Math.abs(acc));
  const v0 = (BASE_SPEED + club.speed + S.power * POWER_SPEED) * (.5 + .5 * setPower) * quality;
  const yaw = acc * 6 * Math.PI / 180, pitch = LAUNCH_DEG * Math.PI / 180;
  ball.vx = v0 * Math.cos(pitch) * Math.sin(yaw); ball.vz = v0 * Math.cos(pitch) * Math.cos(yaw); ball.vy = v0 * Math.sin(pitch);
  ball.spin = acc * 2.2;          // 휘어 나가는 정도 (훅/슬라이스)
  ball.drag = DRAG_K * b.drag; ball.wind = b.wind; ball.roll = b.roll; ball.steer = 0;

  $("swing").classList.add("hidden");
}
function launch() {
  phase = "fly"; hitAt = performance.now(); trail = [[0, 0.02, 0]]; ball.lx = 0; ball.lz = 0;
  $("flyDist").classList.add("on");
  snd("hit");
  if (lastShot.perfect) toast("✨ 나이스 임팩트!");
}
function step(dt) {
  if (phase === "power" || phase === "accuracy") {
    const speed = phase === "power" ? 1.05 : 1.25;
    meterPos += meterDir * speed * dt;
    if (phase === "power" && meterPos >= 1) { meterPos = 1; meterDir = -1; }
    if (phase === "power" && meterPos <= 0 && meterDir < 0) { meterPos = 0; meterDir = 1; }
    if (phase === "accuracy" && meterPos <= 0) hit(0);   // 못 누르면 헛스윙에 가까운 샷
  }
  if (phase === "down" && performance.now() - downAt >= DOWN_MS) launch();
  if (phase === "fly") {
    const sub = 6, h = dt * 1.6 / sub;   // 1.6배 빨리 감기
    for (let i = 0; i < sub && phase === "fly"; i++) {
      const rx = ball.vx - wind.x * ball.wind, rz = ball.vz - wind.z * ball.wind, ry = ball.vy;
      const v = Math.hypot(rx, ry, rz), d = ball.drag * v, vh = Math.hypot(ball.vx, ball.vz);
      ball.vx += (-d * rx + ball.spin * Math.min(1, vh / 40)) * h;
      if (steerDir && canSteer()) { const dv = Math.max(-STEER.max, Math.min(STEER.max, ball.steer + steerDir * STEER.acc * h)) - ball.steer; ball.steer += dv; ball.vx += dv; }

      ball.vy += (-9.8 - d * ry + LIFT_K * vh * vh) * h;
      ball.x += ball.vx * h; ball.y += ball.vy * h; ball.z += ball.vz * h;
      if (ball.y <= 0) {
        const bb = boosterAt(ball.x, ball.z);
        if (bb) { boost(bb); continue; }   // 떨어진 자리에 폭탄 · 대포!
        ball.y = 0;

    const bb = k < 1 && boosterAt(ball.x, ball.z);

      const dir = Math.atan2(rollTo.x - rollTo.from.x, rollTo.z - rollTo.from.z);

  }
  // HUD
  const st = $("steer"), showSteer = phase === "fly" && canSteer();
  if (st.classList.contains("on") !== showSteer) {
    st.classList.toggle("on", showSteer);
    if (showSteer && !step.steerHint) { step.steerHint = true; toast("◀ ▶ 버튼(또는 ← → 키)을 누르고 있으면<br>공이 조금씩 옆으로 움직여요!"); }
  }
  if (ball) {
    const d = Math.hypot(ball.x, ball.z);
    $("flyDist").textContent = d.toFixed(1) + "m";
    moveTrackBall(d);
  }
  if (phase === "power" || phase === "accuracy") {
    $("meterCursor").style.left = (meterPos * 100) + "%";
    $("meterPow").style.width = ((phase === "power" ? meterPos : setPower) * 100) + "%";
  } else if (phase === "ready") { $("meterCursor").style.left = "0%"; $("meterPow").style.width = "0%"; }
}
function finishShot() {

  lastShot.dist = dist; lastShot.ob = ob;
  S.shots++;

  $("resBig").innerHTML = ob ? "OB" : `${dist.toFixed(1)}<small>m</small>`;
  const msg = $("resMsg"), sub = $("resSub");
  msg.className = "msg";
  if (ob) { msg.classList.add("ob"); msg.textContent = "옆으로 너무 벗어났어요! 기록 없음 😵"; sub.textContent = "노란 칸에 맞춰 칠수록 똑바로 날아가요"; snd("wrong"); }

    msg.classList.add("best"); msg.textContent = before > 0 ? `🎉 최고 기록 갱신! (+${(dist - before).toFixed(1)}m)` : "🎉 첫 기록!";
    sub.textContent = member() ? "랭킹에 올리는 중…" : "로그인하면 이 기록이 랭킹에 올라가요";
    snd("best"); recordBest(dist).then(() => { if (member()) sub.textContent = topBoard && topBoard.myRank ? `지금 ${topBoard.myRank}위!` : "랭킹 저장 완료"; });
  } else {
    msg.textContent = lastShot.perfect ? "깔끔한 샷!" : lastShot.acc < -.5 ? "왼쪽으로 휘었어요 (훅)" : lastShot.acc > .5 ? "오른쪽으로 휘었어요 (슬라이스)" : "좋아요!";

}

/* 위쪽 거리 막대 */
function trackMax() {
  const top = topBoard && topBoard.top && topBoard.top[0] ? topBoard.top[0].score : 0;
  const m = Math.max(300, S.best, top) * 1.15;
  return Math.ceil(m / 100) * 100;
}
function drawTrackMarks() {
  const max = trackMax();
  const marks = [];

  if (top) marks.push(`<div class="mark top" style="left:${top.score / max * 100}%"><span>👑 ${esc(top.nickname)} ${fmt(top.score)}m</span></div>`);
  if (S.best > 0) marks.push(`<div class="mark me" style="left:${S.best / max * 100}%"><span>내 최고 ${S.best.toFixed(0)}m</span></div>`);

    else if (own) act = `<button class="buy" data-use="${i}" style="background:rgba(182,255,59,.2);color:var(--lime)">쓰기</button>`;
    else if (!prevOwned) act = `<span class="tag" style="color:var(--sub)">🔒 앞 단계 먼저</span>`;
    else act = `<button class="buy" data-buy="${i}" ${S.cash < it.price ? "disabled" : ""}>💰 ${fmt(it.price)}</button>`;
    return `<div class="item ${isCur ? "cur" : own ? "own" : !prevOwned ? "lock" : ""}"><div class="ic">${it.ic}</div><div class="info"><b>${esc(it.name)}</b><small>${esc(it.desc)} · ${stat}</small></div>${act}</div>`;
  }).join("")}</div>`;
  body.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
    const i = +b.dataset.buy, it = LIST[i]; if (S.cash < it.price) return;
    S.cash -= it.price; S.owned[shopTab].push(i); S[shopTab] = i; snd("buy"); toast(`${it.ic} ${esc(it.name)} 장착!`); save(); refreshAll(); renderShop();
  });
  body.querySelectorAll("[data-use]").forEach(b => b.onclick = () => { S[shopTab] = +b.dataset.use; save(); refreshAll(); renderShop(); });
}

/* ═══════════════════════════════════════════════════════════════
 *  랭킹 창
 * ═══════════════════════════════════════════════════════════════ */
async function renderRank() {
  const list = $("rankList"), note = $("rankNote");
  list.innerHTML = `<li class="empty">불러오는 중…</li>`; note.innerHTML = "";
  const d = await fetchRank();
  const medal = (n) => n === 1 ? "🥇" : n === 2 ? "🥈" : n === 3 ? "🥉" : n;
  if (!d) {
    list.innerHTML = `<li class="empty">랭킹 서버에 연결하지 못했어요 😢<br>인터넷을 확인하거나 잠시 뒤 다시 열어 주세요.</li>`;
    note.innerHTML = `이 기기 최고 기록: <b>${S.best.toFixed(1)}m</b>`; return;
  }
  const me = member() ? A().displayName : null;
  list.innerHTML = d.top && d.top.length
    ? d.top.map((r, i) => `<li class="${me && r.nickname === me ? "me" : ""}"><span class="no">${medal(i + 1)}</span><span class="nm">${esc(r.nickname)}</span><span class="d">${fmt(r.score)}m</span></li>`).join("")
    : `<li class="empty">아직 아무도 기록이 없어요.<br>첫 번째 1위가 되어 보세요! ⛳</li>`;
  note.innerHTML = member()
    ? (d.myRank ? `내 순위 <b>${d.myRank}위</b> / ${fmt(d.total)}명 · 내 최고 <b>${fmt(d.myBest)}m</b>` : `아직 랭킹에 내 기록이 없어요. 한 번 쳐 보세요! (이 기기 최고 ${S.best.toFixed(1)}m)`)
    : `로그인하지 않아서 내 기록은 이 기기에만 있어요 (최고 <b>${S.best.toFixed(1)}m</b>).<br>삼공육 첫 화면 오른쪽 위 ☰ 에서 로그인하면 랭킹에 올라가요.`;
}

/* ═══════════════════════════════════════════════════════════════
 *  버튼 · 입력 · 시작
 * ═══════════════════════════════════════════════════════════════ */
$("mPlay").onclick = play; $("mQuiz").onclick = startQuiz; $("mShop").onclick = () => show("sShop"); $("mRank").onclick = () => show("sRank");
$("bQuiz").onclick = startQuiz; $("bShop").onclick = () => show("sShop"); $("bRank").onclick = () => show("sRank"); $("bMenu").onclick = () => show("sHome");
$("shopQuiz").onclick = startQuiz; $("shopPlay").onclick = play;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => show(phase === "idle" ? "sHome" : null));
$("scene").addEventListener("pointerdown", (e) => { e.preventDefault(); tap(); });
addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") { if (document.activeElement && document.activeElement.tagName === "BUTTON" && e.code === "Enter") return; e.preventDefault(); tap(); }
  if (e.code === "Escape") show($("sHome").classList.contains("hidden") ? "sHome" : null);
  if (e.code === "ArrowLeft" || e.code === "KeyA") { steerKeys.L = true; e.preventDefault(); }
  if (e.code === "ArrowRight" || e.code === "KeyD") { steerKeys.R = true; e.preventDefault(); }
  steerDir = (steerKeys.R ? 1 : 0) - (steerKeys.L ? 1 : 0);
});
addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") steerKeys.L = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") steerKeys.R = false;
  steerDir = (steerKeys.R ? 1 : 0) - (steerKeys.L ? 1 : 0);
});
// 공 조종 버튼 (누르고 있는 동안)
for (const [id, dir] of [["stL", -1], ["stR", 1]]) {
  const b = $(id);
  const on = (e) => { e.preventDefault(); e.stopPropagation(); b.classList.add("hold"); steerDir = dir; try { b.setPointerCapture(e.pointerId); } catch { /* 없음 */ } };
  const off = () => { b.classList.remove("hold"); if (steerDir === dir) steerDir = 0; };
  b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}
// 스윙 버튼 영역도 탭 가능하게
$("swing").style.pointerEvents = "auto"; $("swing").addEventListener("pointerdown", (e) => { e.preventDefault(); tap(); });

// 게이지 칸 위치
$("meterZone").style.left = ((ZONE.at - ZONE.nice) * 100) + "%"; $("meterZone").style.width = (ZONE.nice * 2 * 100) + "%";
$("meterSweet").style.left = ((ZONE.at - ZONE.sweet / 2) * 100) + "%"; $("meterSweet").style.width = (ZONE.sweet * 100) + "%";

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt);
  if (window.GolfView) GolfView.frame(now, dt);   // 3D 화면 (view3d.js)
  requestAnimationFrame(loop);
}
S = fix(readLocal(localKey()));
refreshAll(); newWind(); boosters = makeBoosters(); ball = { x: 0, y: .02, z: 0 };
$("swing").classList.add("hidden");
requestAnimationFrame(loop);
if (A()) {
  A().ready.then(() => { load(); fetchRank(); });
  A().onChange(() => { if (A().ready) A().ready.then(() => { load(); fetchRank(); }); });
}
</script>
</body>
</html>
