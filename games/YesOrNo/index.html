<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말해 YES OR NO — 뼈/근육 문제 풀어보기 · 삼공육</title>
<meta name="theme-color" content="#151632">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  말해 YES OR NO — 삼공육 문제풀기 (맞히면 💰 캐쉬 → 게임에서 아이템 살 때 써요)
  · 화면 구성은 듀오링고 같은 레슨형, 캐릭터는 '뭐라구요!? 안들려요'의 마법사 (img/wizard-*.png 복사본)
  · 학년별 문제: 1학년 = 해부학(근육 · 뼈대계, data1.js) / 2 · 3학년 = 잠금 (아래 OPEN 에서 열어요)
    학년은 관리자가 ☰ 회원 관리에서 정한 학년 (없으면 학번으로 자동). 자기 학년보다 높은 학년 문제는 잠겨요.
  · 캐쉬: ../../wallet.js (모든 게임이 같이 쓰는 지갑). 서버 저장은 supabase/wallet.sql 실행 후.
  · ?back=golf 로 열면 '골프로 돌아가기' 버튼이 생겨요.
-->
<style>
:root {
  --bg: #151632; --bg2: #1d1f45; --line: #34376b; --text: #f1f2ff; --dim: #9ea3d6;
  --blue: #4f7dff; --blue-d: #2f52c4; --gold: #fde74c; --gold-d: #c9a91a;
  --ok: #3ddc84; --ok-d: #23a05c; --ok-bg: #12352a;
  --bad: #ff5c7a; --bad-d: #c42e4c; --bad-bg: #3b1726;
  --pink: #ff2e88; --cyan: #2de2e6;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -200px, #2a2470 0%, transparent 70%), var(--bg);
  color: var(--text); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  overflow-y: scroll; display: flex; flex-direction: column; min-height: 100dvh; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hide { display: none !important; }
.screen { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; padding: 18px 20px 0; }

/* 두툼한 입체 버튼 */
.btn {
  border: 0; border-radius: 16px; padding: 15px 22px; font-weight: 800; font-size: 17px; letter-spacing: .02em;
  background: var(--blue); color: #fff; box-shadow: 0 5px 0 var(--blue-d); transition: transform .06s, box-shadow .06s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-d); }
.btn:disabled { background: #2b2e5a; color: #6d71a8; box-shadow: 0 5px 0 #20224a; cursor: default; filter: none; transform: none; }
.btn.ghost { background: transparent; color: var(--blue); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.gold { background: var(--gold); color: #2a2200; box-shadow: 0 5px 0 var(--gold-d); }
.btn.ok { background: var(--ok); color: #06251a; box-shadow: 0 5px 0 var(--ok-d); }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 5px 0 var(--bad-d); }
.btn.wide { width: 100%; }

/* ---------- 홈 ---------- */
#home { align-items: center; text-align: center; padding-bottom: 28px; }
.homeTop { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.back { color: var(--dim); text-decoration: none; font-weight: 700; font-size: 14px; }
.chips { display: flex; gap: 14px; font-weight: 800; }
.chips span { display: flex; align-items: center; gap: 5px; }
.chips .cash { color: var(--gold); }
.logo {
  font-family: "Black Han Sans", sans-serif; font-size: clamp(44px, 11vw, 72px); line-height: .95; margin: 20px 0 6px;
  color: #fff; text-shadow: 0 0 18px rgba(79, 125, 255, .7), 0 4px 0 #2f52c4;
}
.logo b { color: var(--gold); font-weight: normal; text-shadow: 0 0 18px rgba(253, 231, 76, .6), 0 4px 0 #8f7b10; }
.logo i { display: block; font-style: normal; font-size: .62em; letter-spacing: .04em; }
.logo i .y { color: var(--ok); text-shadow: 0 0 16px rgba(61, 220, 132, .6), 0 4px 0 var(--ok-d); }
.logo i .n { color: var(--bad); text-shadow: 0 0 16px rgba(255, 92, 122, .6), 0 4px 0 var(--bad-d); }
.sub { color: var(--dim); font-size: 15px; margin: 0; }
.sub b { color: var(--gold); }
.stage { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 6px; margin: 14px 0 4px; min-height: 160px; }
.stage .wiz { height: 150px; }
.bubble {
  position: relative; background: var(--bg2); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px;
  font-weight: 700; font-size: 16px; line-height: 1.5; text-align: left; max-width: 300px; align-self: center; margin-bottom: 50px;
}
.bubble::before, .bubble::after { content: ""; position: absolute; left: -12px; top: 50%; border: 10px solid transparent; border-right-color: var(--line); border-left: 0; transform: translateY(-50%); }
.bubble::after { left: -9px; border-right-color: var(--bg2); }
.wiz { image-rendering: pixelated; animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .45)); }
@keyframes bob { 50% { transform: translateY(-6px); } }
.wiz.happy { animation: hop .5s ease-out 2; }
@keyframes hop { 40% { transform: translateY(-18px) scale(1.04); } }
.wiz.sad { animation: shake .45s ease-in-out; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .45)) saturate(.5); }
@keyframes shake { 20%, 60% { transform: translateX(-7px) rotate(-3deg); } 40%, 80% { transform: translateX(7px) rotate(3deg); } }
.menu { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.who { font-size: 13px; color: var(--dim); line-height: 1.5; }
.who b { color: var(--text); }
.segLabel { font-size: 13px; color: var(--dim); font-weight: 700; margin-bottom: -6px; text-align: left; }
.seg { display: flex; gap: 8px; justify-content: center; }
.seg button { flex: 1; border: 2px solid var(--line); background: transparent; border-radius: 14px; padding: 10px 0; font-weight: 800; color: var(--dim); box-shadow: 0 3px 0 var(--line); }
.seg button.on { border-color: var(--blue); color: #fff; background: rgba(79, 125, 255, .15); box-shadow: 0 3px 0 var(--blue-d); }
.seg button.lock { color: #5d6196; border-style: dashed; box-shadow: none; }
.seg button small { display: block; font-size: 11px; font-weight: 700; margin-top: 2px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode { border: 2px solid var(--line); background: transparent; border-radius: 16px; padding: 14px 6px 12px; box-shadow: 0 4px 0 var(--line); text-align: center; }
.mode em { display: block; font-style: normal; font-size: 30px; margin-bottom: 4px; }
.mode b { display: block; font-size: 15px; }
.mode small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.mode.on { border-color: var(--gold); background: rgba(253, 231, 76, .08); box-shadow: 0 4px 0 var(--gold-d); }
.lockBox { border: 2px dashed var(--line); border-radius: 16px; padding: 22px 16px; color: var(--dim); font-weight: 700; line-height: 1.6; }
.lockBox em { display: block; font-style: normal; font-size: 34px; }
.hint { font-size: 13px; color: var(--dim); margin: -2px 0 0; }

/* ---------- 레슨 ---------- */
.top { display: flex; align-items: center; gap: 14px; height: 44px; }
.x { background: none; border: 0; font-size: 26px; color: var(--dim); padding: 0 4px; line-height: 1; }
.bar { position: relative; flex: 1; height: 18px; border-radius: 99px; background: #2b2e5a; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .45s cubic-bezier(.3, 1.4, .5, 1); }
.bar i::after { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .35); }
.hearts { font-weight: 800; color: var(--bad); display: flex; align-items: center; gap: 4px; min-width: 44px; justify-content: flex-end; }
.hearts.hit { animation: shake .4s; }
.lcash { font-weight: 800; color: var(--gold); white-space: nowrap; }
.lcash.pop { animation: pop .4s; }
.combo { height: 22px; margin: 6px 0 0 44px; font-weight: 900; font-size: 14px; color: var(--gold); letter-spacing: .04em; opacity: 0; transition: opacity .2s; }
.combo.on { opacity: 1; animation: pop .35s; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } }
.label { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
.label h2 { margin: 0; font-size: 22px; font-weight: 900; }
.tag { font-size: 12px; font-weight: 800; color: var(--cyan); border: 1.5px solid rgba(45, 226, 230, .5); border-radius: 99px; padding: 3px 10px; }
.tag.re { color: var(--gold); border-color: rgba(253, 231, 76, .55); }
.fig { margin: 12px 0 0; border-radius: 16px; overflow: hidden; background: #fff; border: 2px solid var(--line); cursor: zoom-in; position: relative; }
.fig img { display: block; width: 100%; max-height: 42vh; object-fit: contain; }
.fig.dark { background: #000; }
.fig::after { content: "🔍 크게 보기"; position: absolute; right: 8px; bottom: 8px; font-size: 11px; font-weight: 800; color: #fff; background: rgba(0, 0, 0, .55); padding: 3px 8px; border-radius: 99px; }
.ask { display: flex; align-items: flex-end; gap: 8px; margin: 12px 0 16px; }
.ask .wiz { height: 110px; flex: none; }
.ask .bubble { max-width: none; flex: 1; margin-bottom: 28px; font-size: 17px; white-space: pre-line; }
.ask .bubble mark { background: none; color: var(--gold); }
.choices { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
.choice {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: transparent; border: 2px solid var(--line); border-radius: 16px; padding: 13px 16px; font-size: 16px; font-weight: 600; line-height: 1.4;
  box-shadow: 0 4px 0 var(--line); transition: transform .06s, box-shadow .06s, background .12s;
}
.choice:hover { background: rgba(255, 255, 255, .03); }
.choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choice .n { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 800; color: var(--dim); }
.choice.sel { border-color: var(--blue); background: rgba(79, 125, 255, .14); box-shadow: 0 4px 0 var(--blue-d); color: #cfe0ff; }
.choice.sel .n { border-color: var(--blue); color: var(--blue); }
.choices.locked .choice { pointer-events: none; }
.choice.right { border-color: var(--ok); background: rgba(61, 220, 132, .12); box-shadow: 0 4px 0 var(--ok-d); color: #c8ffe0; }
.choice.right .n { border-color: var(--ok); color: var(--ok); }
.choice.wrong { border-color: var(--bad); background: rgba(255, 92, 122, .12); box-shadow: 0 4px 0 var(--bad-d); color: #ffd0da; }
.choice.wrong .n { border-color: var(--bad); color: var(--bad); }

/* 아래 확인 / 결과 띠 (화면 끝까지) */
.foot { position: sticky; bottom: 0; margin: auto calc(50% - 50vw) 0; padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); background: var(--bg); }
.foot .in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
.foot .msg { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
.foot .ic { flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 900; background: #fff; }
.foot h3 { margin: 0 0 2px; font-size: 21px; font-weight: 900; }
.foot p { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.45; }
.foot.good { background: var(--ok-bg); border-top-color: transparent; animation: up .22s ease-out; }
.foot.good h3, .foot.good p { color: var(--ok); }
.foot.good .ic { color: var(--ok-d); }
.foot.bad { background: var(--bad-bg); border-top-color: transparent; animation: up .22s ease-out; }
.foot.bad h3, .foot.bad p { color: var(--bad); }
.foot.bad .ic { color: var(--bad-d); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.foot .btn { min-width: 150px; }

/* ---------- 결과 / 하트 소진 ---------- */
.center { align-items: center; justify-content: center; text-align: center; padding-bottom: 28px; }
.center .wiz { height: 160px; margin-bottom: 10px; }
.center h1 { font-family: "Black Han Sans", sans-serif; font-weight: normal; font-size: 40px; margin: 6px 0 6px; color: var(--gold); text-shadow: 0 0 18px rgba(253, 231, 76, .5); }
.center .say { color: var(--dim); margin: 0 0 22px; font-weight: 600; }
.cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
.card { width: 118px; border-radius: 16px; border: 2px solid var(--c); overflow: hidden; animation: pop .4s backwards; }
.card:nth-child(2) { animation-delay: .12s; } .card:nth-child(3) { animation-delay: .24s; }
.card b { display: block; background: var(--c); color: #111; font-size: 12px; font-weight: 900; padding: 5px 0; letter-spacing: .04em; }
.card span { display: block; padding: 12px 0; font-size: 22px; font-weight: 900; color: var(--c); }
.endBtns { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
.review { width: 100%; max-width: 560px; text-align: left; margin: 0 0 22px; display: flex; flex-direction: column; gap: 10px; }
.review div { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
.review small { color: var(--dim); display: block; margin-bottom: 2px; }
.review em { font-style: normal; color: var(--ok); font-weight: 800; }

.spark { position: fixed; pointer-events: none; font-size: 22px; z-index: 9; animation: fly .9s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(200deg) scale(.4); opacity: 0; } }
#zoom { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 20, .92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
#zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; background: #fff; }

@media (max-width: 560px) {
  .ask .wiz { height: 84px; }
  .ask .bubble { font-size: 16px; margin-bottom: 18px; }
  .choice { font-size: 15px; padding: 12px 14px; }
  .foot .in { flex-direction: column; align-items: stretch; gap: 14px; }
  .foot .btn { width: 100%; }
  .foot .ic { width: 44px; height: 44px; font-size: 22px; }
  .foot h3 { font-size: 19px; }
  .stage .wiz { height: 130px; }
  .bubble { font-size: 15px; max-width: 220px; }
  .mode em { font-size: 26px; }
}
</style>
</head>

    <div class="chips"><span title="연속 학습일">🔥 <b id="hStreak">0</b></span><span class="cash" title="내 캐쉬 (모든 게임 공용)">💰 <b id="hCash">0</b></span></div>

<script>
/* ===== 설정 — 숫자를 바꾸면 밸런스가 바뀌어요 ===== */
const HEARTS = 5;          // 하트 수 (틀리면 하나씩 줄어요)
const CASH_RIGHT = 20;     // 처음에 바로 맞히면 💰
const CASH_COMBO = 5;      // 3연속부터 한 문제마다 더 (최대 +20)
const CASH_PERFECT = 50;   // 5문제 이상 레슨을 하나도 안 틀리면 보너스
const KEY = "yesno/v2";    // 이 기기에 저장되는 이름 (연속 학습일 · 오답 노트)
// 학년별 문제. open: false 면 모두에게 잠겨요. 2 · 3학년 문제를 만들면 true 로 바꾸고 modes 를 채우면 돼요.
const GRADES = [
  { g: 1, open: true,  name: "1학년", desc: "해부학 · 근육과 뼈" },
  { g: 2, open: false, name: "2학년", desc: "준비 중" },
  { g: 3, open: false, name: "3학년", desc: "국가고시 랜덤 (준비 중)" },
];
const BACK = { golf: { url: "../LongDrive/index.html", label: "⛳ 골프로 돌아가기" } };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Math.round(n).toLocaleString("ko-KR");
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.random() * a.length | 0];
const D = window.YESNO_G1 || { muscles: [], bones: [] };
/* 손과 발에 이름이 똑같은 근육(긴엄지굽힘근 등)은 문제에서 헷갈리지 않게 (손) · (발) 을 붙여요.
   시트에서 새로 옮겨 와도 자동으로 붙어요: 이름이 두 번 이상 나오는 근육만, 부위(part)를 보고 정해요. */
(() => {
  const side = (part) => /아래팔|손/.test(part) ? "손" : /종아리|발/.test(part) ? "발" : "";

/* ===== 문제 만들기 (1학년: 근육 · 뼈) =====
 * 문제 하나 = { key, tag, q, img?, dark?, opts:[{t, ok}] }  key 로 오답 노트에 저장했다가 다시 만들 수 있어요. */

  const firstN = (arr) => { const seen = new Set(), out = []; for (const t of arr) { if (!seen.has(t)) { seen.add(t); out.push(t); } } return out; };
  if (type === "ko2en") return { key, tag: tag + " · 영어 이름", q: `<mark>${esc(m.ko)}</mark>의 영어 이름은?`, opts: opts(m.en, distract(m.en, firstN(others.map(x => x.en)).slice(0, 8))) };
  if (type === "en2ko") return { key, tag: tag + " · 한글 이름", q: `<mark>${esc(m.en)}</mark>${jo(m.en, "은", "는")} 어떤 근육?`, opts: opts(m.ko, distract(m.ko, firstN(others.map(x => x.ko)).slice(0, 8))) };

let ac;
function tone(freqs, dur = .12, type = "sine", gap = .09, vol = .16) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, k) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + k * gap;
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);

  else {
    list = []; const keys = new Set();
    for (let t = 0; list.length < LEN && t < LEN * 20; t++) {
      const q = makeOne(MODE); if (!q || q.opts.length < 2 || keys.has(q.key)) continue;
      keys.add(q.key); list.push(q);

  }
  if (!list.length) return;
  L = { fromWrong, list, queue: list.map(q => ({ q, retry: false })), total: list.length, done: 0, hearts: HEARTS,
        combo: 0, cash: 0, firstRight: 0, wrongs: [], t0: Date.now(), cur: null, sel: -1, checked: false };

  $("srcTag").textContent = L.cur.retry ? "🔁 다시 풀기" : q.tag;

  $("endWiz").src = clear ? "img/wizard-cast.png" : "img/wizard-idle.png";
  $("endWiz").className = "wiz " + (clear ? "happy" : "sad");
  $("endTitle").textContent = clear ? (acc === 100 ? "완벽한 레슨!" : "레슨 완료!") : "하트를 다 썼네!";
  $("endTitle").style.color = clear ? "" : "var(--bad)";
  $("endSay").innerHTML = (clear
    ? (acc === 100 ? `하나도 안 틀렸군! 만점 보너스 💰 +${bonus}` : acc >= 70 ? "좋아, 실력이 늘고 있어! 틀린 건 오답 노트에 넣어 뒀네." : "괜찮네, 틀린 문제는 오답 노트에서 다시 만나세.")
    : "오늘은 여기까지. 번 캐쉬는 그대로 남아 있네!") + `<br>지금 내 캐쉬 💰 <b style="color:var(--gold)">${fmt(window.Wallet ? Wallet.cash : 0)}</b>`;
  const mm = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  $("endCards").innerHTML = [
    ["#fde74c", "번 캐쉬", `💰 ${fmt(L.cash)}`],
    ["#3ddc84", "첫 시도 정답", `🎯 ${acc}%`],
    ["#4f7dff", "걸린 시간", `⏱ ${mm}`],
  ].map(([c, b, v]) => `<div class="card" style="--c:${c}"><b>${b}</b><span>${v}</span></div>`).join("");
  $("review").classList.add("hide");
  $("review").innerHTML = L.wrongs.map(q => `<div><small>${esc(q.tag)}</small>${q.q.replace(/\n/g, " ")}<br>→ <em>${esc(q.opts.find(o => o.ok).t)}</em></div>`).join("");
  $("showWrong").classList.toggle("hide", !L.wrongs.length);
  $("showWrong").textContent = `틀린 문제 보기 (${L.wrongs.length})`;
  $("toBack").classList.toggle("hide", !back);
  show("end");
}

/* ===== 버튼 · 키보드 ===== */
$("check").onclick = check;
$("quit").onclick = () => { if (!L || L.done === 0 || confirm("그만할까요? 지금까지 번 캐쉬는 그대로 남아요.")) { L = null; home(); } };
$("again").onclick = () => start(!!(L && L.fromWrong && S.wrong.length));
$("toHome").onclick = home;
$("toBack").onclick = () => { if (back) location.href = back.url; };
$("showWrong").onclick = () => $("review").classList.toggle("hide");
$("fig").onclick = () => { $("zoomImg").src = $("figImg").src; $("zoom").classList.remove("hide"); };
$("zoom").onclick = () => $("zoom").classList.add("hide");
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("zoom").classList.add("hide");
  if ($("lesson").classList.contains("hide") || !L) return;
  const n = +e.key;
  if (n >= 1 && n <= L.opts.length) select(n - 1);
  else if (e.key === "Enter") { e.preventDefault(); if (L.sel >= 0) check(); }
});
if (window.Wallet) Wallet.onChange(c => { $("hCash").textContent = fmt(c); });
home();
// 로그인 상태를 다 읽으면 (학년 · 이름) 홈을 다시 그려요
if (auth() && auth().ready) auth().ready.then(() => { if (!$("home").classList.contains("hide")) home(); });
</script>
</body>
</html>
