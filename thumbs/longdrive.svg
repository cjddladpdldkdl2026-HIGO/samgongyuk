    <rect x="430" y="172" width="30" height="38"/><rect x="464" y="186" width="40" height="24"/><rect x="508" y="160" width="26" height="50"/><rect x="538" y="180" width="44" height="30"/><rect x="586" y="168" width="54" height="42"/>
  </g>
  <rect y="208" width="640" height="152" fill="#164a26"/>
