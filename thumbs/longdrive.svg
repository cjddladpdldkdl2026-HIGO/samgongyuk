  <text x="320" y="88" text-anchor="middle" font-family="'Black Han Sans', 'Malgun Gothic', sans-serif" font-size="66" fill="url(#title)" stroke="#13361c" stroke-width="2" filter="url(#glow)">롱드라이브</text>
