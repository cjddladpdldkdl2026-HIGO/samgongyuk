    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset=".6" stop-color="#ff2e88"/><stop offset="1" stop-color="#9b1d8a"/>
    </linearGradient>
